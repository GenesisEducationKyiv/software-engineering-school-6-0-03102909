<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Release Notifications</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f3;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .container {
        max-width: 480px;
        width: 100%;
      }

      .header {
        margin-bottom: 2rem;
        text-align: center;
      }
      .header h1 {
        font-size: 22px;
        font-weight: 500;
        margin-bottom: 6px;
      }
      .header p {
        font-size: 14px;
        color: #666;
      }

      .card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 1.5rem;
      }

      label {
        display: block;
        font-size: 13px;
        color: #666;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 9px 12px;
        font-size: 14px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus {
        border-color: #999;
      }

      .hint {
        font-size: 12px;
        color: #999;
        margin-top: 6px;
      }
      code {
        font-family: monospace;
      }

      .field {
        margin-bottom: 1rem;
      }
      .field:last-of-type {
        margin-bottom: 1.5rem;
      }

      button {
        width: 100%;
        padding: 10px;
        font-size: 14px;
        font-weight: 500;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: opacity 0.15s;
      }
      button:hover {
        opacity: 0.85;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .message {
        margin-top: 1rem;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }
      .message.success {
        background: #f0fdf4;
        color: #166534;
      }
      .message.error {
        background: #fef2f2;
        color: #991b1b;
      }

      .footer {
        font-size: 12px;
        color: #999;
        text-align: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>GitHub release notifications</h1>
        <p>Get an email when a new release drops.</p>
      </div>

      <div class="card">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="field">
          <label for="repo">Repository</label>
          <input type="text" id="repo" placeholder="owner/repo (e.g. facebook/react)" />
          <p class="hint">Format: <code>owner/repo</code></p>
        </div>

        <button id="submit-btn" onclick="handleSubmit()">Subscribe</button>

        <div class="message success" id="success"></div>
        <div class="message error" id="error">
          <span id="error-msg">Something went wrong.</span>
        </div>
      </div>

      <p class="footer">You can unsubscribe at any time via the link in the email.</p>
    </div>

    <script>
      async function handleSubmit() {
        const email = document.getElementById('email').value.trim();
        const repo = document.getElementById('repo').value.trim();
        const btn = document.getElementById('submit-btn');
        const success = document.getElementById('success');
        const error = document.getElementById('error');
        const errorMsg = document.getElementById('error-msg');

        success.style.display = 'none';
        error.style.display = 'none';

        if (!email || !repo) {
          errorMsg.textContent = 'Please fill in all fields.';
          error.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Subscribing...';

        try {
          const res = await fetch('/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, repo }),
          });

          const data = await res.json();

          if (res.ok) {
            success.textContent = data.message ?? 'Subscription queued successfully.';
            success.style.display = 'block';
            document.getElementById('email').value = '';
            document.getElementById('repo').value = '';
          } else {
            errorMsg.textContent = data.error ?? 'Something went wrong.';
            error.style.display = 'block';
          }
        } catch {
          errorMsg.textContent = 'Network error. Please try again.';
          error.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Subscribe';
        }
      }
    </script>
  </body>
</html>
